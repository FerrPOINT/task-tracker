name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      backend_build: ${{ steps.classify.outputs.backend_build }}
      openapi_check: ${{ steps.classify.outputs.openapi_check }}
      cli_build: ${{ steps.classify.outputs.cli_build }}
      server_checks: ${{ steps.classify.outputs.server_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact comparison commits
        working-directory: task-tracker
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$HEAD_SHA" in *[!0-9a-f]*|"") echo "Invalid exact head" >&2; exit 1;; esac
          [ "${#HEAD_SHA}" -eq 40 ] || exit 1
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "Checkout differs from head" >&2; exit 1; }
          if [ "$EVENT_NAME" = push ] && [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            : # Initial push intentionally selects all components.
          else
            case "$BASE_SHA" in *[!0-9a-f]*|"") echo "Invalid exact base" >&2; exit 1;; esac
            [ "${#BASE_SHA}" -eq 40 ] || exit 1
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
          fi
      - name: Verify packaged Base selector
        run: |
          python3 - <<'PY'
          # Generated from Base package_quality_selector.ci_packet_source.
          import hashlib,json,os,re,stat
          from pathlib import Path
          root=Path('task-tracker')
          def chunks(path,budget):
              for entry in (path,*path.parents):
                  if entry.is_symlink() or getattr(entry,'is_junction',lambda:False)():
                      raise SystemExit('Packaged Base inputs must not contain links')
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit('Packaged Base input must be a regular file')
              with path.open('rb') as stream:
                  if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                      raise SystemExit('Packaged Base input must be a regular file')
                  size=0
                  while block:=stream.read(min(65536,budget-size+1)):
                      size+=len(block)
                      if size>budget:
                          raise SystemExit('Packaged Base input exceeds its byte budget')
                      yield block
          def read(path,budget):
              return b''.join(chunks(path,budget))
          def checksum(path,budget):
              value=hashlib.sha256()
              for block in chunks(path,budget):
                  value.update(block)
              return value.hexdigest()
          def unique(pairs):
              value=dict(pairs)
              if len(value)!=len(pairs):
                  raise SystemExit('Duplicate packaged Base metadata key')
              return value
          pin=read(root/'.quality-tooling-revision',1024).decode('ascii').strip()
          receipt=json.loads(read(root/'scripts/vendor/base-quality-tooling.json',65536),object_pairs_hook=unique)
          if (not isinstance(receipt,dict) or not re.fullmatch(r'[0-9a-f]{40}',pin)
                  or receipt.get('schema') not in ('base-quality-tooling/v1','base-quality-tooling/v2')
                  or receipt.get('revision')!=pin
                  or receipt.get('repository')!='https://github.com/FerrPOINT/services-base'
                  or receipt.get('source')!='scripts/quality_selection.py'
                  or not isinstance(receipt.get('sha256'),str) or not re.fullmatch(r'[0-9a-f]{64}',receipt['sha256'])):
              raise SystemExit('Packaged Base revision mismatch')
          if checksum(root/'scripts/vendor/base_quality_selection.py',1048576)!=receipt['sha256']:
              raise SystemExit('Packaged Base selector checksum mismatch')
          if receipt['schema']=='base-quality-tooling/v2':
              generator=receipt.get('frontend_generator')
              if (not isinstance(generator,dict) or set(generator)!={'source','file','contract','sha256'}
                      or generator['source']!='scripts/generate_openapi.mjs'
                      or generator['file']!='frontend/scripts/base-generate-openapi.mjs'
                      or generator['contract']!='base-openapi-generation/v1'
                      or not isinstance(generator['sha256'],str) or not re.fullmatch(r'[0-9a-f]{64}',generator['sha256'])):
                  raise SystemExit('Packaged Base generator registration mismatch')
              if checksum(root/generator['file'],65536)!=generator['sha256']:
                  raise SystemExit('Packaged Base generator checksum mismatch')
          elif 'frontend_generator' in receipt:
              raise SystemExit('Packaged Base generator registration requires packet v2')
          PY
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -m scripts.select_ci
        working-directory: task-tracker
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: README validator tests
        working-directory: task-tracker
        run: |
          python3 -B -m unittest scripts.tests.test_current_performance_routes scripts.tests.test_quality_routes scripts.tests.test_ci_contract_checks scripts.tests.test_build_pin scripts.tests.test_verify_readme scripts.tests.test_dockerfile_budget scripts.tests.test_base_maintenance
          bash -n scripts/backup.sh scripts/restore.sh
      - name: README structural validation
        working-directory: task-tracker
        run: python3 scripts/verify_readme.py
  backend:
    needs:
      - changes
      - docs
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: task-tracker/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read pinned Base revision
        id: base
        working-directory: task-tracker
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: task-tracker
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: task-tracker/backend
          cache-targets: false
      - run: cargo fmt --all -- --check
      - name: Quick domain/SDK unit tests
        if: needs.changes.outputs.server_checks == 'true'
        run: cargo test --locked -p domain --lib
      - name: Check only selected server
        if: needs.changes.outputs.backend_build == 'true'
        run: cargo check --locked -p server --bin server
      - name: Check only selected official CLI
        if: needs.changes.outputs.cli_build == 'true'
        run: cargo check --locked -p task-tracker-cli --bin task-tracker
      - name: OpenAPI drift gate
        if: needs.changes.outputs.openapi_check == 'true'
        run: |
          mkdir -p ../openapi
          cargo run --locked -p api --bin gen-openapi > ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated
    env:
      CARGO_BUILD_JOBS: 1
  frontend:
    needs:
      - changes
      - docs
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: task-tracker/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read pinned Base revision
        id: base
        working-directory: task-tracker
        run: |
          pin=.base-ui-revision
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@pdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: task-tracker
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: task-tracker/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - name: Typecheck prepared generated sources once
        run: pnpm exec tsc --noEmit
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm format:check
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - name: Generated contract and lockfile stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/schema.d.ts
      - run: pnpm build:compile
        if: needs.changes.outputs.frontend_build == 'true'
