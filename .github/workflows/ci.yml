name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
      - name: README validator tests
        working-directory: task-tracker
        run: python3 -m unittest scripts.tests.test_verify_readme scripts.tests.test_ci_contract_checks
      - name: README structural validation
        working-directory: task-tracker
        run: python3 scripts/verify_readme.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: tasktracker
          POSTGRES_DB: tasktracker_infra_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasktracker -d tasktracker_infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: task-tracker/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: task-tracker/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - name: Deleted issue key restore (isolated PostgreSQL)
        env:
          TT_TEST_DATABASE_URL: postgres://tasktracker@127.0.0.1:5432/tasktracker_infra_test
        run: cargo test --locked -p infra --test repos deleted_issue_key_can_be_resolved_for_restore_only -- --ignored --test-threads=1
      - name: OpenAPI drift gate
        run: |
          mkdir -p ../openapi
          cargo run -p api --bin gen-openapi > ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: task-tracker/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: task-tracker
          fetch-depth: 0
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: task-tracker/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm openapi:compat
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
